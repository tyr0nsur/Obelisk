# Install as /etc/nginx/sites-available/flowark-dashboard.conf and symlink to sites-enabled.
# Replace ark.example.com with the real dashboard hostname.

server {
    listen 80;
    server_name ark.example.com;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ark.example.com;

    # Use certbot or your certificate manager to provision these paths.
    ssl_certificate /etc/letsencrypt/live/ark.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ark.example.com/privkey.pem;

    client_max_body_size 6m;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
