name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scripts:
    name: Script tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Python scripts
        run: |
          python3 -m py_compile \
            scripts/analyze_reflectionscanner_capture.py \
            scripts/build_core_dump_evidence_pack.py \
            scripts/build_reflection_evidence_pack.py \
            scripts/check_chat_reflection_benchmark.py \
            scripts/verify_chat_reflection_constants.py \
            scripts/test_scan_core_fname_tables.py \
            scripts/test_enumerate_core_uobjects.py \
            scripts/test_inspect_core_ufunctions.py \
            scripts/test_build_core_dump_evidence_pack.py \
            scripts/test_check_chat_reflection_benchmark.py \
            scripts/test_analyze_reflectionscanner_capture.py \
            scripts/test_verify_chat_reflection_constants.py \
            scripts/test_summarize_core_ufunction_inventory.py \
            scripts/test_research_doc_guardrails.py \
            scripts/test_public_sdk_chat_guardrails.py \
            scripts/test_dependency_pins.py \
            scripts/test_versioning_guardrails.py \
            scripts/test_secret_guardrails.py \
            scripts/test_repo_hygiene.py

      - name: Check shell scripts parse
        run: |
          bash -n scripts/install_obelisk.sh
          bash -n scripts/test_install_obelisk_layout.sh
          bash -n scripts/check_obelisk_server_posture.sh
          bash -n scripts/test_check_obelisk_server_posture.sh
          bash -n packaging/linuxgsm/ObeliskRun.sh
          bash -n packaging/linuxgsm/ObeliskRunDebug.sh

      - name: Run analyzer tests
        run: python3 scripts/test_analyze_reflectionscanner_capture.py

      - name: Run core evidence pack tests
        run: |
          python3 scripts/test_scan_core_fname_tables.py
          python3 scripts/test_enumerate_core_uobjects.py
          python3 scripts/test_inspect_core_ufunctions.py
          python3 scripts/test_build_core_dump_evidence_pack.py

      - name: Run chat benchmark gate tests
        run: python3 scripts/test_check_chat_reflection_benchmark.py

      - name: Run chat reflection verifier tests
        run: |
          python3 scripts/test_verify_chat_reflection_constants.py
          python3 scripts/test_summarize_core_ufunction_inventory.py

      - name: Run research doc guardrail tests
        run: |
          python3 scripts/test_research_doc_guardrails.py
          python3 scripts/test_public_sdk_chat_guardrails.py
          python3 scripts/test_dependency_pins.py
          python3 scripts/test_versioning_guardrails.py
          python3 scripts/test_secret_guardrails.py
          python3 scripts/test_repo_hygiene.py

      - name: Run server posture tests
        run: scripts/test_check_obelisk_server_posture.sh

  build:
    name: CMake build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

      - name: Run chat reflection benchmark gate
        run: |
          cmake --build build --target chat_reflection_benchmark --parallel
          ./build/chat_reflection_benchmark 5000 > /tmp/obelisk-chat-reflection-benchmark.txt
          python3 scripts/check_chat_reflection_benchmark.py /tmp/obelisk-chat-reflection-benchmark.txt

      - name: Check diff whitespace
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}"...HEAD
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff --check
          else
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          fi

      - name: Installer dry run
        run: scripts/install_obelisk.sh --dry-run /tmp/obelisk-ci-install

      - name: Validate installed SDK layout
        run: scripts/test_install_obelisk_layout.sh /tmp/obelisk-ci-layout

  docs:
    name: Documentation hygiene
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whitespace
        run: |
          python3 - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          files = subprocess.check_output(
              [
                  "git",
                  "ls-files",
                  "-z",
                  "--",
                  "*.md",
                  ".github/*.md",
                  ".github/workflows/*.yml",
              ],
              text=False,
          ).split(b"\0")
          bad = []

          for raw in files:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              for number, line in enumerate(data.splitlines(), start=1):
                  if line.endswith((b" ", b"\t")):
                      bad.append(f"{path}:{number}: trailing whitespace")

          if bad:
              print("\n".join(bad))
              sys.exit(1)
          PY
