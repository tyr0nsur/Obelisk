name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scripts:
    name: Script tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Python scripts
        run: |
          python3 -m py_compile \
            scripts/analyze_reflectionscanner_capture.py \
            scripts/test_analyze_reflectionscanner_capture.py

      - name: Run analyzer tests
        run: python3 scripts/test_analyze_reflectionscanner_capture.py

  build:
    name: CMake build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel

  docs:
    name: Documentation hygiene
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whitespace
        run: |
          python3 - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          files = subprocess.check_output(
              [
                  "git",
                  "ls-files",
                  "-z",
                  "--",
                  "*.md",
                  ".github/*.md",
                  ".github/workflows/*.yml",
              ],
              text=False,
          ).split(b"\0")
          bad = []

          for raw in files:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              for number, line in enumerate(data.splitlines(), start=1):
                  if line.endswith((b" ", b"\t")):
                      bad.append(f"{path}:{number}: trailing whitespace")

          if bad:
              print("\n".join(bad))
              sys.exit(1)
          PY
