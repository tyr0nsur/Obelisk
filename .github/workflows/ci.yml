name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scripts:
    name: Script tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run script and guardrail tests
        run: scripts/run_script_tests.sh

  build:
    name: CMake build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libssl-dev \
            ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

      - name: Run chat reflection benchmark gate
        run: |
          cmake --build build --target chat_reflection_benchmark --parallel
          ./build/chat_reflection_benchmark 5000 > /tmp/obelisk-chat-reflection-benchmark.txt
          python3 scripts/check_chat_reflection_benchmark.py /tmp/obelisk-chat-reflection-benchmark.txt

      - name: Check diff whitespace
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}"...HEAD
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff --check
          else
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          fi

  docs:
    name: Documentation hygiene
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whitespace
        run: |
          python3 - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          files = subprocess.check_output(
              [
                  "git",
                  "ls-files",
                  "-z",
                  "--",
                  "*.md",
                  ".github/*.md",
                  ".github/workflows/*.yml",
              ],
              text=False,
          ).split(b"\0")
          bad = []

          for raw in files:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              for number, line in enumerate(data.splitlines(), start=1):
                  if line.endswith((b" ", b"\t")):
                      bad.append(f"{path}:{number}: trailing whitespace")

          if bad:
              print("\n".join(bad))
              sys.exit(1)
          PY

  release-readiness:
    name: Release readiness
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libssl-dev \
            ninja-build

      - name: Run release-readiness baseline gate
        # Canonical gate owns production libobelisk.so test-only symbol checks plus install/SDK dry-runs.
        # Gameplay/module promotion requires scripts/check_release_readiness.sh --require-second-source-readiness.
        # CI runs the core-first baseline only; complete/stable SDK claim attempts need an explicit release-manager gate.
        run: scripts/check_release_readiness.sh

  reflection-base-readiness:
    name: Reflection base readiness
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check committed public RC UFunction target sets
        run: |
          python3 scripts/compare_reflection_snapshots.py \
            --base-root tests/fixtures/ufunction_snapshots \
            --readiness-report \
            --fail-on-base-readiness-gaps \
            --target-set minimal-second-source-intake \
            --target-set structure-observer-intake \
            --target-set chat-message-intake
