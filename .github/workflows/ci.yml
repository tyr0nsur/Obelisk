name: Native prototype CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scripts:
    name: Script tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native prototype scripts and contracts
        run: |
          python3 -m unittest discover -s scripts -p test_obelisk_plugin_ctl.py
          python3 -m unittest discover -s scripts -p test_obelisk_migrate.py
          python3 -m unittest discover -s scripts -p test_plugin_manager_guardrails.py
          python3 -m unittest discover -s scripts -p test_public_sdk_guardrails.py
          python3 -m unittest discover -s scripts -p test_publish_discord_beta_guide.py
          bash -n scripts/install_obelisk.sh scripts/install_obelisk_plugin.sh

  build:
    name: CMake build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libssl-dev \
            libsqlite3-dev \
            ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

      - name: Run chat reflection benchmark gate
        run: |
          cmake --build build --target chat_reflection_benchmark --parallel
          ./build/chat_reflection_benchmark 5000 > /tmp/obelisk-chat-reflection-benchmark.txt
          python3 scripts/check_chat_reflection_benchmark.py /tmp/obelisk-chat-reflection-benchmark.txt

      - name: Check diff whitespace
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}"...HEAD
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff --check
          else
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          fi

  docs:
    name: Documentation hygiene
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whitespace
        run: |
          python3 - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          files = subprocess.check_output(
              [
                  "git",
                  "ls-files",
                  "-z",
                  "--",
                  "*.md",
                  ".github/*.md",
                  ".github/workflows/*.yml",
              ],
              text=False,
          ).split(b"\0")
          bad = []

          for raw in files:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              for number, line in enumerate(data.splitlines(), start=1):
                  if line.endswith((b" ", b"\t")):
                      bad.append(f"{path}:{number}: trailing whitespace")

          if bad:
              print("\n".join(bad))
              sys.exit(1)
          PY
